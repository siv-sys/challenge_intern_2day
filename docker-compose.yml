services:
  mysql:
    image: mysql:8.4
    container_name: challenge_intern_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: challenge_intern
    ports:
      - '3309:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pchangeme']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
